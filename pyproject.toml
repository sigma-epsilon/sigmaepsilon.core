[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmaepsilon.core"
version = "1.2.2"
description = "Common developer utilities for Python projects."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
maintainers = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "appdirs",
    "six",
    "toml",
]

[project.urls]
Homepage = "https://github.com/sigma-epsilon/sigmaepsilon.core"
Repository = "https://github.com/sigma-epsilon/sigmaepsilon.core"
Documentation = "https://sigmaepsiloncore.readthedocs.io/en/latest/?badge=latest"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmaepsilon"]

[tool.hatch.build.targets.sdist]
include = ["src/sigmaepsilon", "README.md", "LICENSE"]

[tool.uv]
# Poetry groups were opt-in; keep it that way (`uv sync --group <name>`).
default-groups = []

[dependency-groups]
dev = [
    "black>=24.2.0,<25",
    "flake8>=7.0.0,<8",
    "ipykernel>=6.29.2,<7",
    "numpy>=1.26.4,<2",
    "tornado>=6.3.3",
]
test = [
    "pytest>=8.0.1,<9",
    "pytest-cov>=4.1.0,<5",
    "coverage>=7.4.1,<8",
    "numpy>=1.26.4,<2",
    "flake8>=7.0.0,<8",
]
docs = [
    "sphinx>=7.2.6,<8",
    "ipython>=8.21.0,<9",
    "myst-parser>=2.0.0,<3",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-design>=0.5.0,<0.6",
    "sphinx-inline-tabs>=2023.4.21,<2024",
    "pydata-sphinx-theme>=0.15.2,<0.16",
    "numpy>=1.26.4,<2",
]
